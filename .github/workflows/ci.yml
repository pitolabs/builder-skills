name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 (reads "packageManager" from package.json)
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      # The base and public fixture tests run mise; each fixture installs its tools against its own mise.lock.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: false
          cache: false
      - run: bun install --frozen-lockfile
      - run: uv sync --locked
      - run: bun run format:check
      - run: sh scripts/ruff.sh format --check .
      - run: sh scripts/ruff.sh check .
      - run: bun run typecheck
      # The fixture tests install real packages (bun install, uv sync, mise install) and run the audits end to end.
      - run: bun test test/
  base:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans every commit
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false # tools are verified against mise.lock on every download; a restored cache is not
      - run: mise run check:secrets
      - run: mise run check:workflows
        env:
          GH_TOKEN: ${{ github.token }} # zizmor's online audits (known-vulnerable-actions, stale refs)
      - run: mise run check:shell
      - run: mise run check:vulns
  # A backstop, not prevention: when it runs, the commits are already public (the hooks are what keep them private).
  privacy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit, not only the last one
          persist-credentials: false
          # A pull request's own commits, not the test merge GitHub makes for it: that one is authored with the
          # opener's GitHub e-mail setting and never reaches main.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false # privacy-scan.sh runs the gitleaks pinned in mise.toml
      - run: sh scripts/privacy-scan.sh --history
        env:
          PRIVACY_BLOCKLIST_TEXT: ${{ secrets.PRIVACY_BLOCKLIST }}
          PRIVACY_BLOCKLIST_OPTIONAL: ${{ github.event.pull_request.head.repo.fork || false }}
