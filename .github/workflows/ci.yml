name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 # reads "packageManager" from package.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.11"
      - run: bun install --frozen-lockfile
      - run: uv sync --locked
      - run: bun run format:check
      - run: sh scripts/ruff.sh format --check .
      - run: sh scripts/ruff.sh check .
      - run: bun run typecheck
      # The fixture tests install real packages (bun install, uv sync) and run both audits end to end.
      - run: bun test test/
  # A backstop, not prevention: when it runs, the commits are already public (the hooks are what keep them private).
  privacy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit, not only the last one
      - run: sh scripts/privacy-scan.sh --history
        env:
          PRIVACY_BLOCKLIST_TEXT: ${{ secrets.PRIVACY_BLOCKLIST }}
          PRIVACY_BLOCKLIST_OPTIONAL: ${{ github.event.pull_request.head.repo.fork || false }}
