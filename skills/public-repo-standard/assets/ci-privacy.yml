# A job for .github/workflows/ci.yml. A backstop, not prevention: when it runs, the commits are already public. It
# catches what a machine without the hooks pushed, and new rules applied to old history.
  privacy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # every commit, not only the last one
      - run: sh scripts/privacy-scan.sh --history
        env:
          # Repository secret: the blocklist's text (gh secret set PRIVACY_BLOCKLIST < ~/.config/privacy/blocklist.txt).
          PRIVACY_BLOCKLIST_TEXT: ${{ secrets.PRIVACY_BLOCKLIST }}
          # A pull request from a fork gets no secrets: scan it with gitleaks and the identity check only.
          PRIVACY_BLOCKLIST_OPTIONAL: ${{ github.event.pull_request.head.repo.fork || false }}
