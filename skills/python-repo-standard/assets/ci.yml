# .github/workflows/ci.yml for a uv project. Pin actions and uv by version; uv.lock pins the rest, .python-version
# the interpreter.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.10.11"
      - run: uv sync --locked # fails if uv.lock no longer matches pyproject.toml; --frozen would not check
      - run: sh scripts/ruff.sh format --check .
      - run: sh scripts/ruff.sh check .
      - run: uv run --locked pytest
