# .github/workflows/ci.yml for a uv project. Actions are pinned by commit SHA (Renovate keeps the SHA and the version
# comment current) and uv by version; uv.lock pins the rest, .python-version the interpreter. The token is read-only.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: uv sync --locked # fails if uv.lock no longer matches pyproject.toml; --frozen would not check
      - run: sh scripts/ruff.sh format --check .
      - run: sh scripts/ruff.sh check .
      - run: uv run --locked pytest
